<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#B20710" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E50914" stop-opacity="0.2" />
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Border -->
  <path d="M250 40 L410 110 V230 C410 340 250 440 250 440 C250 440 90 340 90 230 V110 Z" 
        fill="none" stroke="#FF1E27" stroke-width="4" filter="url(#redGlow)" opacity="0.6"/>

  <!-- Shield Base (Cyber Red Gradient) -->
  <path d="M250 45 L400 112 V228 C400 330 250 425 250 425 C250 425 100 330 100 228 V112 Z" 
        fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="6"/>

  <!-- White Inner Shield Frame -->
  <path d="M250 75 L370 128 V220 C370 300 250 380 250 380 C250 380 130 300 130 220 V128 Z" 
        fill="#050505" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Cyber Circuit Node Elements -->
  <g fill="#FFFFFF">
    <!-- Center Cyber Emblem / Keyhole & Lock Nodes -->
    <path d="M250 140 L310 170 V240 L250 280 L190 240 V170 Z" fill="none" stroke="#E50914" stroke-width="5"/>
    <circle cx="250" cy="200" r="18" fill="#E50914"/>
    <path d="M242 200 L258 200 L262 250 L238 250 Z" fill="#E50914"/>
    
    <!-- Circuit Lines -->
    <line x1="250" y1="140" x2="250" y2="105" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="250" cy="105" r="5" fill="#FFFFFF"/>
    
    <line x1="190" y1="205" x2="155" y2="205" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="155" cy="205" r="5" fill="#FFFFFF"/>

    <line x1="310" y1="205" x2="345" y2="205" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="345" cy="205" r="5" fill="#FFFFFF"/>

    <line x1="250" y1="280" x2="250" y2="330" stroke="#E50914" stroke-width="4"/>
    <circle cx="250" cy="330" r="6" fill="#FF1E27"/>
  </g>
</svg>
