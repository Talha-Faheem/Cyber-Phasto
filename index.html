<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Pashto Premium — Technology Academy & Defense</title>
  <meta name="description" content="Cyber Pashto Premium — Technology education platform with a distinct Pashtun visual language. Practical courses in cybersecurity, programming, AI and digital careers." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              red: '#FF0205',
              'red-dark': '#B00000',
              'red-bright': '#FF1616',
              black: '#050505',
              ink: '#090909',
              border: '#292929',
              muted: '#8d8d8d',

            mono: ['DM Mono', 'monospace']
          }
        }
      }
    }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<body class="bg-[#050505] text-white font-sans overflow-x-hidden antialiased">
